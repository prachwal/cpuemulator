name: dotnet

on:
  push:
  pull_request:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore tests/CpuEmulator.Tests/CpuEmulator.Tests.csproj

       - name: Test with coverage
         run: dotnet test tests/CpuEmulator.Tests/CpuEmulator.Tests.csproj --configuration Release --logger "trx;LogFileName=test-results.trx" --results-directory "${{ github.workspace }}/TestResults" /p:CollectCoverage=true /p:CoverletOutputFormat=cobertura,json /p:CoverletOutput="${{ github.workspace }}/TestResults/coverage"

      - name: List test results
        if: always()
        run: find "${{ github.workspace }}" -name "*.trx" -print

       - name: Publish test results
         uses: dorny/test-reporter@v1
         if: always()
         with:
           name: dotnet-tests
           path: TestResults/*.trx
           reporter: dotnet-trx

       - name: Publish coverage report
         uses: dorny/test-reporter@v1
         if: always()
         with:
           name: dotnet-coverage
           path: TestResults/coverage.cobertura.xml
           reporter: dotnet-cobertura

       - name: Check coverage threshold
         run: |
           # Parse coverage percentage from JSON file
           COVERAGE=$(grep -oP '"Percent":\s*\K[0-9.]+' TestResults/coverage/coverage.json | head -1)
           echo "Coverage: $COVERAGE%"
           # Convert to integer for comparison
           COVERAGE_INT=$(echo "$COVERAGE" | cut -d. -f1)
           if [ "$COVERAGE_INT" -lt 80 ]; then
             echo "Coverage is below 80%!"
             exit 1
           fi

      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: TestResults
