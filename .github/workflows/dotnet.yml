name: dotnet

on:
  push:
  pull_request:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore CpuEmulator.sln

      - name: Build
        run: dotnet build CpuEmulator.sln --configuration Release --no-restore

      - name: Test with coverage
        run: >-
          dotnet test tests/CpuEmulator.Tests/CpuEmulator.Tests.csproj
          --configuration Release
          --logger "trx;LogFileName=test-results.trx"
          --results-directory "${{ github.workspace }}/TestResults"
          /p:CollectCoverage=true
          /p:CoverletOutputFormat=cobertura
          /p:CoverletOutput="${{ github.workspace }}/TestResults/coverage"
          /p:Threshold=80
          /p:ThresholdType=line

      - name: List test results
        if: always()
        run: find "${{ github.workspace }}" -name "*.trx" -o -name "*.xml" -print

      - name: Publish test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: dotnet-tests
          path: TestResults/*.trx
          reporter: dotnet-trx

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-results
          path: TestResults/coverage.cobertura.xml

      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: TestResults
