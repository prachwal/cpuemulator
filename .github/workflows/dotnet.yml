name: dotnet

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore src/CpuEmulator.App/CpuEmulator.App.csproj

      - name: Build
        run: dotnet build src/CpuEmulator.App/CpuEmulator.App.csproj --configuration Release

      - name: Run tests
        run: dotnet run --project tests/CpuEmulator.Tests/CpuEmulator.Tests.csproj

      - name: Upload junit results
        uses: actions/upload-artifact@v4
        with:
          name: junit-results
          path: test-results/junit.xml
